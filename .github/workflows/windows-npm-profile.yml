name: Windows npm install profile

on:
  push:
    branches: [mdangelo/codex/windows-npm-install-performance]

permissions:
  contents: read
  actions: read

jobs:
  profile:
    name: Windows npm / ${{ matrix.cache }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cache: [cold, fallback]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Resolve npm cache
        id: npm
        shell: bash
        run: printf 'path=%s\n' "$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Restore downloads from a different primary key
        if: matrix.cache == 'fallback'
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm.outputs.path }}
          key: node-cache-Windows-x64-npm-profile-${{ github.run_id }}
          restore-keys: node-cache-Windows-x64-npm-
      - name: Verify fallback matched an existing cache
        if: matrix.cache == 'fallback'
        shell: bash
        env:
          PRIMARY_HIT: ${{ steps.restore.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          test "$PRIMARY_HIT" != true
          test -n "$MATCHED_KEY"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: 12017995827
          run-id: 38831680764
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
      - name: Profile the complete installed-package verification
        working-directory: sdk/typescript
        shell: bash
        env:
          npm_config_cache: ${{ matrix.cache == 'cold' && format('{0}/npm-empty', runner.temp) || steps.npm.outputs.path }}
          npm_config_timing: "true"
          npm_config_loglevel: http
          npm_config_logs_dir: ${{ runner.temp }}/npm-install-logs
        run: node scripts/check-package.mjs ../../dist/*.tgz
      - name: Retain npm install timing and debug logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-npm-${{ matrix.cache }}
          path: ${{ runner.temp }}/npm-install-logs
          retention-days: 7
